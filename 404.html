<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#12243a">
  <title>페이지를 찾을 수 없습니다 | 검단신도시 부자부동산</title>
  <style>
    :root{color-scheme:light;--navy:#12243a;--gold:#aa8b56;--muted:#69798b;--paper:#f6f5f1}
    *{box-sizing:border-box}
    body{display:grid;min-height:100vh;margin:0;padding:24px;background:var(--paper);color:var(--navy);font-family:"Noto Sans KR","Malgun Gothic",sans-serif}
    main{width:min(100%,720px);margin:auto;padding:clamp(28px,7vw,64px);border:1px solid #e4e0d6;background:#fff;text-align:center;box-shadow:0 20px 60px #12243a0b}
    .brand{display:inline-flex;align-items:center;gap:12px;color:var(--navy);font-weight:700;text-decoration:none}
    .brand img{width:44px;height:44px}
    .eyebrow{margin:48px 0 12px;color:var(--gold);font-size:12px;font-weight:700;letter-spacing:.18em}
    h1{margin:0;font-size:clamp(30px,6vw,48px);letter-spacing:-.05em}
    .message{margin:18px 0 30px;color:var(--muted);font-size:16px;line-height:1.8}
    nav{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
    nav a{display:inline-flex;min-height:48px;align-items:center;justify-content:center;padding:0 18px;border:1px solid #d9dce0;color:var(--navy);font-size:14px;font-weight:650;text-decoration:none}
    nav a:first-child{border-color:var(--navy);background:var(--navy);color:white}
    nav a:hover{border-color:var(--gold)}
    @media(max-width:480px){body{padding:14px}main{padding:30px 20px}.eyebrow{margin-top:36px}.message{font-size:14px}nav{display:grid}nav a{width:100%}}
  </style>
</head>
<body>
  <main>
    <a class="brand" href="/"><img src="/buja-logo.svg" alt=""><span>검단신도시 부자부동산</span></a>
    <p class="eyebrow">PAGE NOT FOUND · 404</p>
    <h1>페이지를 찾을 수 없습니다.</h1>
    <p class="message">주소가 변경되었거나 입력하신 페이지가 없을 수 있습니다.<br>원하시는 메뉴를 선택해 다시 이동해 주세요.</p>
    <nav aria-label="다른 페이지로 이동">
      <a href="/">홈으로 돌아가기</a>
      <a href="/#listings">추천 매물 보기</a>
      <a href="/#guide">부동산 안내 보기</a>
      <a href="/#contact">전화 상담·오시는 길</a>
    </nav>
  </main>
</body>
</html>
