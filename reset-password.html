<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#12243a">
  <title>관리자 비밀번호 재설정 | 부자부동산</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/styles.css">
  <style>
    body{min-height:100vh;background:#f3f5f7;display:grid;place-items:center;padding:24px}
    .reset-card{width:min(100%,460px);padding:34px;background:#fff;border:1px solid #e1e6ea;box-shadow:0 16px 45px rgba(18,36,58,.08)}
    .reset-brand{display:flex;align-items:center;gap:12px;margin-bottom:25px;color:#12243a;text-decoration:none}
    .reset-brand img{width:42px;height:42px}.reset-brand b{display:block;font-size:17px}.reset-brand small{color:#687787}
    .reset-card h1{margin:0 0 10px;color:#12243a;font-size:25px}.reset-intro{margin:0 0 23px;color:#647282;line-height:1.7;font-size:14px}
    .reset-card label{display:block;margin:16px 0 6px;color:#344354;font-size:13px;font-weight:700}
    .reset-card input{width:100%;padding:13px;border:1px solid #d7dfe5;border-radius:4px;background:#fff;font-size:15px}
    .reset-card button{width:100%;margin-top:20px;padding:14px;border:0;background:#12243a;color:#fff;font-weight:700;font-size:15px;cursor:pointer}
    .reset-card button:disabled{opacity:.6;cursor:wait}.reset-message{min-height:24px;margin:14px 0 0;color:#536273;font-size:13px;line-height:1.65}.reset-message.error{color:#a33d35}.reset-message.success{color:#16734a}
    .reset-back{display:inline-block;margin-top:16px;color:#42566b;font-size:13px}
    @media(max-width:520px){body{padding:16px}.reset-card{padding:25px 20px}.reset-card h1{font-size:22px}}
  </style>
</head>
<body>
  <main class="reset-card">
    <a class="reset-brand" href="/">
      <img src="/buja-logo.svg" alt="">
      <span><b>부자부동산</b><small>검단신도시 전문 중개</small></span>
    </a>
    <h1>관리자 비밀번호 재설정</h1>
    <p class="reset-intro">새 비밀번호를 입력해 주세요. 재설정 링크는 한 번만 사용할 수 있습니다.</p>
    <form id="reset-form" hidden>
      <label for="new-password">새 비밀번호</label>
      <input id="new-password" name="password" type="password" autocomplete="new-password" minlength="8" required>
      <label for="confirm-password">새 비밀번호 확인</label>
      <input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required>
      <button id="reset-submit" type="submit">비밀번호 변경</button>
    </form>
    <p id="reset-message" class="reset-message" role="status" aria-live="polite">재설정 링크를 확인하고 있습니다.</p>
    <a class="reset-back" href="/admin.html">관리자 로그인으로 돌아가기</a>
  </main>
  <script src="/config.js"></script>
  <script src="/reset-password.js" defer></script>
</body>
</html>
